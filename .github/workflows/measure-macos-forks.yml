name: Measure macOS test forks (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  measure:
    name: macos-latest with ${{ matrix.forks }} test fork(s)
    strategy:
      fail-fast: false
      matrix:
        forks: [1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseStringDeduplication
        --enable-native-access=ALL-UNNAMED
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        working-directory: de.peeeq.wurstscript
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: 'gradle'
      - name: Pin Gradle toolchain
        shell: bash
        run: |
          echo "org.gradle.java.installations.paths=${JAVA_HOME}" >> gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
          # Measurement only: let the single fork finish so its full time is known.
          sed -i '' 's/timeout = Duration.ofMinutes(20)/timeout = Duration.ofMinutes(30)/' build.gradle
          grep -n "Duration.ofMinutes(30)" build.gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Lua compiler (macOS)
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: brew install lua
      - name: Hardware
        shell: bash
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sysctl vm.swapusage
      - name: Compile tests
        shell: bash
        run: ./gradlew testClasses --no-daemon --stacktrace --quiet
      - name: Run tests
        timeout-minutes: 30
        shell: bash
        run: |
          ( while true; do
              echo "$(date +%s) $(sysctl -n vm.swapusage) | $(memory_pressure -Q | tail -1)" >> "$RUNNER_TEMP/memory.log"
              sleep 15
            done ) &
          SAMPLER=$!
          start=$(date +%s)
          status=0
          ./gradlew test -PtestForks=${{ matrix.forks }} --no-daemon --stacktrace --quiet || status=$?
          echo "test task wall time: $(( $(date +%s) - start )) s, exit $status"
          kill $SAMPLER || true
          echo "--- memory samples (swap usage, free percentage)"
          cat "$RUNNER_TEMP/memory.log"
          exit $status
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-forks-${{ matrix.forks }}
          path: de.peeeq.wurstscript/build/test-results/test/*.xml
          retention-days: 7
