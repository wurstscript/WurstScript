name: Dist check (temporary, not for merge)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  package:
    name: Package slim runtime on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseCompactObjectHeaders
        -XX:+UseStringDeduplication
        --enable-native-access=ALL-UNNAMED
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        working-directory: de.peeeq.wurstscript
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'
      - name: Pin Gradle toolchain
        shell: bash
        run: |
          echo "org.gradle.java.installations.paths=${JAVA_HOME}" >> gradle.properties
          echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
      - name: What the JDK brings
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la "$JAVA_HOME/lib/server" "$JAVA_HOME/bin/server" 2>/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Package slim runtime
        shell: bash
        run: ./gradlew packageSlimCompilerDist --no-daemon --stacktrace
      - name: What the distribution has
        shell: bash
        run: |
          ls -la build/dist/slim-*/wurst-runtime/lib/server build/dist/slim-*/wurst-runtime/bin/server 2>/dev/null || true
          RT="$(ls -d build/dist/slim-*/wurst-runtime)"
          env -u JAVA_TOOL_OPTIONS "$RT/bin/java" -Xshare:on -version
