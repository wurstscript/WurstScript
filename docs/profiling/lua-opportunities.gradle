// Opt-in research fixtures; never part of the ordinary test source set.
allprojects {
    afterEvaluate {
        sourceSets.test.java.srcDir('../docs/profiling/lua-opportunities')
        tasks.withType(Test).configureEach {
            ['arrayListSource', 'arrayListBaseline', 'arrayListTests'].each { key ->
                if (providers.gradleProperty(key).isPresent()) {
                    systemProperty("wurst.${key}", providers.gradleProperty(key).get())
                }
            }
        }
    }
}
