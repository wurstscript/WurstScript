// Run from de.peeeq.wurstscript with -I ../docs/profiling/runmap-profile.gradle.
allprojects {
    afterEvaluate {
        tasks.register('compileRunMapProfile', JavaCompile) {
            dependsOn tasks.named('classes')
            source files('../docs/profiling/RunMapProfile.java', '../docs/profiling/RunMapProfileReport.java',
                '../docs/profiling/IncrementalHotReloadProfile.java', '../docs/profiling/MapCommitHotReloadProfile.java',
                '../docs/profiling/SymbolHotReloadProfile.java')
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = layout.buildDirectory.dir('runmap-profile')
            javaCompiler = javaToolchains.compilerFor(java.toolchain)
            options.errorprone.enabled = false
        }
        tasks.register('runMapProfile', JavaExec) {
            dependsOn tasks.named('compileRunMapProfile')
            def runtime = sourceSets.main.runtimeClasspath
            if (project.hasProperty('profileCompilerClasses')) {
                runtime = files(project.property('profileCompilerClasses')) +
                    (runtime - sourceSets.main.output.classesDirs)
            }
            classpath = files(layout.buildDirectory.dir('runmap-profile')) + runtime
            mainClass = 'RunMapProfile'
            args file(project.property('profileRoot')).absolutePath,
                project.property('profileMap'), file('temp/' + project.property('profileLabel')).absolutePath
            workingDir file(project.property('profileRoot'))
            maxHeapSize = '4g'
            jvmArgs '-XX:+UseParallelGC'
            if (project.hasProperty('diagnosticNoCopy')) jvmArgs '-Dprofile.unscoped=true'
        }
        tasks.register('runMapProfileReport', JavaExec) {
            dependsOn tasks.named('compileRunMapProfile')
            classpath = files(layout.buildDirectory.dir('runmap-profile'))
            mainClass = 'RunMapProfileReport'
            args file('temp/' + project.property('profileLabel') + '.jfr').absolutePath
        }
        tasks.register('incrementalHotReloadProfile', JavaExec) {
            dependsOn tasks.named('compileRunMapProfile')
            classpath = files(layout.buildDirectory.dir('runmap-profile')) + sourceSets.main.runtimeClasspath
            mainClass = 'IncrementalHotReloadProfile'
            javaLauncher = tasks.named('test', Test).get().javaLauncher
            args file(project.property('profileRoot')).absolutePath
            workingDir file(project.property('profileRoot'))
            maxHeapSize = '4g'
            jvmArgs '-XX:+UseParallelGC'
        }
        tasks.register('mapCommitHotReloadProfile', JavaExec) {
            dependsOn tasks.named('compileRunMapProfile')
            classpath = files(layout.buildDirectory.dir('runmap-profile')) + sourceSets.main.runtimeClasspath
            mainClass = 'MapCommitHotReloadProfile'
            javaLauncher = tasks.named('test', Test).get().javaLauncher
            args file(project.property('profileRoot')).absolutePath
            workingDir file(project.property('profileRoot')).toPath().resolve('project').toFile()
            if (project.hasProperty('profilePublicCompiler')) jvmArgs '-Dprofile.publicCompiler=true'
            if (project.hasProperty('profileMeasure')) jvmArgs '-Dprofile.measure=true'
            if (project.hasProperty('profileCommitLimit')) jvmArgs '-Dprofile.commitLimit=' + project.property('profileCommitLimit')
            if (project.hasProperty('profileContinueOnError')) jvmArgs '-Dprofile.continueOnError=true'
            maxHeapSize = '6g'
            jvmArgs '-XX:+UseParallelGC'
        }
        tasks.register('symbolHotReloadProfile', JavaExec) {
            dependsOn tasks.named('compileRunMapProfile')
            def runtime = sourceSets.main.runtimeClasspath
            if (project.hasProperty('profileCompilerClasses')) {
                runtime = files(project.property('profileCompilerClasses')) + (runtime - sourceSets.main.output.classesDirs)
            }
            classpath = files(layout.buildDirectory.dir('runmap-profile')) + runtime
            mainClass = 'SymbolHotReloadProfile'
            javaLauncher = tasks.named('test', Test).get().javaLauncher
            args file(project.property('profileRoot')).absolutePath, file(project.property('profileEdit')).absolutePath
            workingDir file(project.property('profileRoot'))
            if (project.hasProperty('profilePublicCompiler')) jvmArgs '-Dprofile.publicCompiler=true'
            if (project.hasProperty('profileRuns')) jvmArgs '-Dprofile.runs=' + project.property('profileRuns')
            if (project.hasProperty('profileBaseline')) jvmArgs '-Dprofile.baseline=true'
            maxHeapSize = '6g'
            jvmArgs '-XX:+UseParallelGC'
        }
    }
}
