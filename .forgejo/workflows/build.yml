# Forgejo Actions for the WurstScript compiler.
#
# The GitHub workflow in .github/workflows/ asks for ubuntu/windows/macos
# runners. This Forgejo instance has one host runner, labeled
# nix-shell-glcom (nixos-llm hosts/nixos/forgejo-runner.nix). A .forgejo
# workflows directory replaces .github entirely, so the GitHub matrix is
# not queued here.
#
# The dev shell (flake.nix) supplies JDK 25 and Lua 5.3. The shell is
# evaluated from a copy of just the flake files: `nix develop .` would
# copy the whole compiler tree into the Nix store on every commit.

name: CI (build & test)

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gradle test (nixos)
    runs-on: nix-shell-glcom
    timeout-minutes: 90
    steps:
      - name: Checkout (runner mirror)
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Drop the stale /donach/ insteadOf that older jobs wrote into the
          # runner gitconfig. It 404s on this tenant-less Forgejo. A longer
          # identity insteadOf beats a system-wide rewrite of
          # https://git.bitp.cz/ -> https://git.bitp.cz/donach/ (longest match
          # wins) without editing /etc/gitconfig.
          git config --global --remove-section 'url.https://git.bitp.cz/donach/code-fixxers/' 2>/dev/null || true
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          mirror="$HOME/.cache/ci-mirror/${GITHUB_REPOSITORY}.git"
          export GIT_TERMINAL_PROMPT=0
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"
          auth="http.${GITHUB_SERVER_URL}/.extraheader=Authorization: basic $(printf 'x-access-token:%s' "${CI_TOKEN:-}" | base64 -w0)"
          [ -n "${CI_TOKEN:-}" ] || auth="core.askPass=true"
          keep="url.https://git.bitp.cz/code-fixxers/.insteadOf=https://git.bitp.cz/code-fixxers/"
          mkdir -p "$(dirname "$mirror")"
          python3 -c 'import fcntl,subprocess,sys; f=open(sys.argv[1],"a"); fcntl.flock(f,fcntl.LOCK_EX); sys.exit(subprocess.call(sys.argv[2:]))' \
            "$mirror.lock" sh -c '
              [ -d "$1" ] || git init -q --bare "$1"
              git -C "$1" config gc.auto 0
              git -C "$1" -c "$2" -c "$3" fetch -q "$4" \
                "+refs/heads/master:refs/heads/master" \
                "+refs/tags/*:refs/tags/*" \
                "+$5:refs/ci/$5"
            ' _ "$mirror" "$auth" "$keep" "$url" "$GITHUB_SHA"
          git init -q .
          echo "$mirror/objects" > .git/objects/info/alternates
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          [ -z "${CI_TOKEN:-}" ] || git config "${auth%%=*}" "${auth#*=}"
          git -c advice.detachedHead=false checkout -q --force "$GITHUB_SHA"
          git --no-pager log -1 --format='checked out %h %s'

      - name: Test
        run: |
          set -eu
          shell=$(mktemp -d)
          cp flake.nix flake.lock "$shell/"
          nix develop "$shell" --command bash -c '
            set -eu
            cd de.peeeq.wurstscript
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            jlink --version
            lua5.3 -e "assert(_VERSION == \"Lua 5.3\")"
            luac5.3 -v
            # Project gradle.properties turns toolchain auto-download on.
            # Pin the Nix JDK so Gradle does not ask foojay for another one.
            exec ./gradlew test --no-daemon --stacktrace \
              -Dorg.gradle.java.installations.auto-download=false \
              -Dorg.gradle.java.installations.auto-detect=false \
              -Dorg.gradle.java.installations.paths="$JAVA_HOME"
          '
